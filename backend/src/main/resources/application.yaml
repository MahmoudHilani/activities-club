server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: activitiesclub
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:activitiesclub}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app_password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 7MB

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
  uploads:
    dir: ${UPLOADS_DIR:${user.dir}/../public/uploads}
