server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: activitiesclub
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:activitiesclub}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:app_password}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-jwt-secret-change-me-dev-only-jwt-secret-change-me}
    expiration-ms: ${JWT_EXPIRATION_MS:900000}
